# Render "Blueprint": New -> Blueprint -> pick this repo. Render creates the backend and asks you for the values marked sync:false.
services:
  - type: web
    name: harvestx-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: AUTH_PROVIDER
        value: google
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: IMAGE_CHECK_PROVIDER
        value: mock
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL        # Supabase "Session pooler" connection string
        sync: false
      - key: CARD_ENCRYPTION_KEY # 64 hex characters. Make it once and never lose it.
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLIENT_URL          # https://muhammad-shahadat.github.io  (site origin only: no path, no trailing slash)
        sync: false
